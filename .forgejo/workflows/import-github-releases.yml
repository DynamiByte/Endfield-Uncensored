name: import github releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: zig-0.16-alpine
    timeout-minutes: 60

    env:
      GH_REPO: DynamiByte/Endfield-Uncensored
      GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}

    steps:
      - name: import
        shell: bash
        run: |
          set -euo pipefail

          fj_api="https://git.dynamibyte.com/api/v1/repos/$FORGEJO_REPOSITORY"
          gh_api="https://api.github.com/repos/$GH_REPO"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fj_headers=(
            -H "Authorization: token $FORGEJO_TOKEN"
            -H 'Accept: application/json'
          )

          gh_headers=(
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2026-03-10'
          )

          if [ -n "${GH_TOKEN:-}" ]; then
            gh_headers+=(-H "Authorization: Bearer $GH_TOKEN")
          fi

          fj() {
            curl -fsS "${fj_headers[@]}" "$@"
          }

          gh() {
            curl -fsS "${gh_headers[@]}" "$@"
          }

          gh "$gh_api/releases?per_page=100" > "$tmp/releases.json"

          if [ "$(jq length "$tmp/releases.json")" -eq 0 ]; then
            echo 'no gh releases'
            exit 1
          fi

          release_num=0

          while IFS= read -r release; do
            release_num=$((release_num + 1))
            release_file="$tmp/release-$release_num.json"
            payload="$tmp/payload-$release_num.json"
            printf '%s\n' "$release" > "$release_file"

            tag="$(jq -r '.tag_name' "$release_file")"

            jq '{
              tag_name,
              target_commitish: (.target_commitish // "master"),
              name: (.name // .tag_name),
              body: (.body // ""),
              draft,
              prerelease
            }' "$release_file" > "$payload"

            current="$(fj "$fj_api/releases/tags/$tag" 2>/dev/null || true)"

            if [ -n "$current" ]; then
              id="$(jq -r '.id' <<< "$current")"
              fj -X PATCH -H 'Content-Type: application/json' \
                --data-binary "@$payload" \
                "$fj_api/releases/$id" > "$tmp/current.json"
              echo "update $tag"
            else
              fj -X POST -H 'Content-Type: application/json' \
                --data-binary "@$payload" \
                "$fj_api/releases" > "$tmp/current.json"
              id="$(jq -r '.id' "$tmp/current.json")"
              echo "create $tag"
            fi

            asset_num=0

            while IFS= read -r asset; do
              asset_num=$((asset_num + 1))
              asset_file="$tmp/asset-$release_num-$asset_num.json"
              download="$tmp/download-$release_num-$asset_num"
              printf '%s\n' "$asset" > "$asset_file"

              name="$(jq -r '.name' "$asset_file")"
              url="$(jq -r '.browser_download_url' "$asset_file")"
              size="$(jq -r '.size' "$asset_file")"
              type="$(jq -r '.content_type // "application/octet-stream"' "$asset_file")"

              old="$({
                jq -c --arg name "$name" \
                  '.assets[]? | select(.name == $name)' \
                  "$tmp/current.json"
              } | head -n 1)"

              if [ -n "$old" ]; then
                old_id="$(jq -r '.id' <<< "$old")"
                old_size="$(jq -r '.size' <<< "$old")"

                if [ "$old_size" = "$size" ]; then
                  echo "keep $tag/$name"
                  continue
                fi

                fj -X DELETE "$fj_api/releases/$id/assets/$old_id" > /dev/null
              fi

              curl -fsSL "$url" > "$download"
              got="$(wc -c < "$download" | tr -d ' ')"
              test "$got" = "$size"

              encoded="$(jq -rn --arg name "$name" '$name | @uri')"
              fj -X POST \
                -F "attachment=@$download;type=$type" \
                "$fj_api/releases/$id/assets?name=$encoded" > /dev/null

              echo "upload $tag/$name"
            done < <(jq -c '.assets[]?' "$release_file")
          done < <(jq -c 'reverse[]' "$tmp/releases.json")

          echo done
